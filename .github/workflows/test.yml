name: test
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-module:
    name: test (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v2 は別モジュール(v2/go.mod)のため、ルートの ./... には含まれない
        working-directory:
          - .
          - v2
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.working-directory }}/go.mod
          cache-dependency-path: ${{ matrix.working-directory }}/go.sum
      - name: Run tests
        run: go test -v ./...

  # ブランチプロテクションの required status checks は "test" を参照しているため、
  # matrix の結果をこのジョブに集約する。skipped は成功扱いになるので always() で必ず実行する。
  test:
    needs: test-module
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: needs.test-module.result != 'success'
        run: exit 1
